name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Create Android folder
      run: |
        rm -rf android
        flutter create --project-name cx_vpn --platforms=android .

    - name: Configure AndroidManifest (Permissions, VPN Service & Ads)
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        
        # 1. Permissions တွေ ထည့်မယ် (Internet နဲ့ Cleartext Traffic ပါ ထည့်ထားတယ်)
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" \/>\n\n    <application android:usesCleartextTraffic="true"/' $MANIFEST

        # 2. VPN Service နဲ့ Start.io App ID ကို ထည့်မယ်
        sed -i 's|</application>|    <service android:name="com.flutter_v2ray_client.V2RayVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false" android:foregroundServiceType="specialUse">\n            <intent-filter>\n                <action android:name="android.net.VpnService"/>\n            </intent-filter>\n        </service>\n        <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="209308326" \/>\n        <meta-data android:name="com.startapp.sdk.RETURN_ADS_ENABLED" android:value="false" \/>\n    <\/application>|' $MANIFEST

    - name: Fix Android SDK, NDK & AGP Versions (.kts files)
      run: |
        # 1. app/build.gradle.kts ထဲက SDK နဲ့ NDK Version တွေကို ပြောင်းမယ်
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
        sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
        sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
        sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts

        # 2. settings.gradle.kts ထဲက AGP Version ကို ပိုမိုတိကျစွာ ရှာပြီး 8.11.1 သို့ ပြောင်းမယ်
        sed -i 's/id("com.android.application") version "[^"]*" apply false/id("com.android.application") version "8.11.1" apply false/' android/settings.gradle.kts
        sed -i 's/id("com.android.library") version "[^"]*" apply false/id("com.android.library") version "8.11.1" apply false/' android/settings.gradle.kts

    - name: Fix AAPT2 Version and Add Gradle Properties
      run: |
        # AAPT2 Version သတ်မှတ်ခြင်း
        echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties
        # Flutter နှင့် AGP 9 ၏ New DSL မကိုက်ညီမှုကို ဖြေရှင်းရန် ပိတ်ထားခြင်း
        echo "android.newDsl=false" >> android/gradle.properties

    - name: Clean and Install dependencies
      run: |
        flutter clean
        flutter pub get

    - name: Build APKs (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Upload APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    - name: Upload APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

    - name: Upload APK (x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
