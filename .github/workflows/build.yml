name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.22.0' 
        cache: true

    - name: Create Android folder (v2)
      run: |
        rm -rf android
        flutter create --project-name cx_vpn --platforms=android .

    - name: Add Permissions to AndroidManifest
      run: |
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n\n    <application/' android/app/src/main/AndroidManifest.xml

    # ✅ SDK Version တွေကို အတင်း ပြောင်းမယ် (Start.io SDK အတွက်)
    - name: Fix Android SDK Versions
      run: |
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
        sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
        sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' android/app/build.gradle
        
    # ✅ Gradle Plugin ကို အသစ်ဆုံး ပြောင်းမယ် (SDK 36 ကို ထောက်ပံ့ဖို့)
    - name: Fix Android Gradle Plugin
      run: |
        sed -i 's/com.android.application" version ".*"/com.android.application" version "8.2.0"/' android/settings.gradle
        sed -i 's/com.android.library" version ".*"/com.android.library" version "8.2.0"/' android/settings.gradle

    # ✅ AAPT2 version ကို SDK 36 နဲ့ ကိုက်ညီအောင် သတ်မှတ်ခြင်း
    - name: Fix AAPT2 Version for SDK 36
      run: |
        echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Build APKs (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Upload APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    - name: Upload APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

    - name: Upload APK (x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
