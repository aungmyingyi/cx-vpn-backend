name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        version: 'latest'
        cache: true

    # ဒီအဆင့်က Android Folder မရှိရင် အလိုအလျောက် ဖန်တီးပေးသွားမှာပါ
    - name: Create Android folder if missing
      run: |
        if [ ! -d "android" ]; then
          flutter create --project-name cx_vpn --platforms=android .
        fi

    # ဒီအဆင့်က Permission တွေကို အလိုအလျောက် ထည့်ပေးသွားမှာပါ
    - name: Add Permissions to AndroidManifest
      run: |
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n\n    <application/' android/app/src/main/AndroidManifest.xml

    - name: Install dependencies
      run: flutter pub get

    - name: Build APKs (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Upload APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    - name: Upload APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

    - name: Upload APK (x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
