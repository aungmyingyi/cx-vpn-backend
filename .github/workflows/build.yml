name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Create missing platform folders
      run: flutter create --project-name cx_vpn .

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: echo "y" | sdkmanager "ndk;25.1.8937393"

    - name: Inject VPN Service into AndroidManifest
      run: |
        python3 - <<'EOF'
        import re
        file_path = 'android/app/src/main/AndroidManifest.xml'
        with open(file_path, 'r') as f:
            content = f.read()
        
        service_xml = '''
            <service
                android:name="com.github.xiaokang.flutter_v2ray.v2ray.V2rayService"
                android:permission="android.permission.BIND_VPN_SERVICE"
                android:exported="false">
                <intent-filter>
                    <action android:name="android.net.VpnService"/>
                </intent-filter>
            </service>
        '''
        
        if 'V2rayService' not in content:
            content = content.replace('</application>', service_xml + '</application>')
            with open(file_path, 'w') as f:
                f.write(content)
        EOF

    - name: Configure Android Gradle for VPN
      run: |
        # Android Setting တွေကို အတင်းပြင်မယ်
        sed -i 's/compileSdk .*/compileSdk = 34/g' android/app/build.gradle.kts || true
        sed -i 's/compileSdkVersion .*/compileSdkVersion = 34/g' android/app/build.gradle || true
        
        sed -i 's/minSdk .*/minSdk = 24/g' android/app/build.gradle.kts || true
        sed -i 's/minSdkVersion .*/minSdkVersion = 24/g' android/app/build.gradle || true

        # NDK Version ကို သတ်မှတ်မယ်
        echo "ndkVersion = \"25.1.8937393\"" >> android/app/build.gradle.kts || true
        echo "ndkVersion \"25.1.8937393\"" >> android/app/build.gradle || true
      
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release --no-shrink
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-apk
        path: build/app/outputs/flutter-apk/app-release.apk
