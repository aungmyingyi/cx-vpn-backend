name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        version: 'latest'
        cache: true

    - name: Create missing platform folders (safe)
      run: |
        if [ ! -d "android" ]; then
          echo "android/ not found — running flutter create"
          flutter create --project-name cx_vpn --platforms=android .
        else
          echo "android/ exists — skipping flutter create"
        fi

    - name: Install dependencies
      run: flutter pub get

    - name: Build APKs (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: List generated APKs
      run: ls -lh build/app/outputs/flutter-apk/

    - name: Upload APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    - name: Upload APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

    - name: Upload APK (x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
