name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        version: 'latest'
        
    - name: Create missing platform folders
      run: flutter create --project-name cx_vpn .
      
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release --split-per-abi # <--- ဒီနေရာမှာ ပြောင်းထားပါတယ်
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-apk
        path: build/app/outputs/flutter-apk/*.apk # <--- APK အားလုံးကို ယူခိုင်းခြင်း
