name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.19.6' 
        cache: true

    - name: Create Android folder (v2)
      run: |
        rm -rf android
        flutter create --project-name cx_vpn --platforms=android .

    # 1. Kotlin Version ကို 2.0.0 သတ်မှတ်ခြင်း (အကောင်းဆုံးနေရာမှာ ထည့်ထားပါတယ်)
    - name: Fix Kotlin Version to 2.0.0
      run: |
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.0"/' android/build.gradle
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.0"/' android/settings.gradle

    - name: Add Permissions to AndroidManifest
      run: |
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n\n    <application/' android/app/src/main/AndroidManifest.xml

    - name: Fix Android SDK Versions
      run: |
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
        sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle
        sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/' android/app/build.gradle

    - name: Fix AAPT2 Version for SDK 35
      run: |
        echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

    - name: Clean Gradle Cache
      run: |
        cd android
        ./gradlew clean
        cd ..

    - name: Install dependencies
      run: flutter pub get

    - name: Build APKs (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Upload APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    - name: Upload APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

    - name: Upload APK (x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
