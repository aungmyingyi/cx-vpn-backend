name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Create missing platform folders
      run: flutter create --project-name cx_vpn .

    - name: Inject VPN Service into AndroidManifest
      run: |
        python3 - <<'EOF'
        import re
        file_path = 'android/app/src/main/AndroidManifest.xml'
        with open(file_path, 'r') as f:
            content = f.read()
        
        service_xml = '''
            <service
                android:name="com.github.xiaokang.flutter_v2ray.v2ray.V2rayService"
                android:permission="android.permission.BIND_VPN_SERVICE"
                android:exported="false">
                <intent-filter>
                    <action android:name="android.net.VpnService"/>
                </intent-filter>
            </service>
        '''
        
        if 'V2rayService' not in content:
            content = content.replace('</application>', service_xml + '</application>')
            with open(file_path, 'w') as f:
                f.write(content)
        EOF

    # ဒီအဆင့်ကို ပြင်ထားပါတယ် (build.gradle နဲ့ build.gradle.kts နှစ်မျိုးလုံးအတွက်)
    - name: Configure Android Gradle for VPN
      run: |
        python3 - <<'EOF'
        import os
        import re

        paths = ['android/app/build.gradle', 'android/app/build.gradle.kts']
        file_path = next((p for p in paths if os.path.exists(p)), None)

        if file_path:
            with open(file_path, 'r') as f:
                content = f.read()

            # compileSdk ကို 34 သို့ ပြောင်းခြင်း
            content = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 34', content)
            content = re.sub(r'compileSdkVersion\s*=?\s*\d+', 'compileSdkVersion = 34', content)
            
            # minSdk ကို 21 သို့ ပြောင်းခြင်း (VPN အတွက် လိုအပ်ချက်)
            content = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 21', content)
            content = re.sub(r'minSdkVersion\s*=?\s*flutter\.minSdkVersion', 'minSdkVersion = 21', content)
            content = re.sub(r'minSdk\s*=?\s*\d+', 'minSdk = 21', content)
            content = re.sub(r'minSdkVersion\s*=?\s*\d+', 'minSdkVersion = 21', content)

            with open(file_path, 'w') as f:
                f.write(content)
            print(f"Successfully updated {file_path}")
        else:
            print("Could not find build.gradle or build.gradle.kts")
        EOF
      
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-apk
        path: build/app/outputs/flutter-apk/app-release.apk
