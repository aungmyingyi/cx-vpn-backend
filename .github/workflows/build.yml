name: Build APK & Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Create Android folder
      run: |
        rm -rf android
        flutter create --project-name cx_vpn --platforms=android .

    - name: Configure AndroidManifest (Permissions, VPN Service & Ads)
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" \/>\n\n    <application android:usesCleartextTraffic="true"/' $MANIFEST

        sed -i 's|</application>|    <service android:name="com.flutter_v2ray_client.V2RayVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false" android:foregroundServiceType="specialUse">\n            <intent-filter>\n                <action android:name="android.net.VpnService"/>\n            </intent-filter>\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="VPN connection"/>\n        </service>\n        <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="209308326" \/>\n        <meta-data android:name="com.startapp.sdk.RETURN_ADS_ENABLED" android:value="false" \/>\n    <\/application>|' $MANIFEST

    - name: Fix Android SDK, NDK & AGP Versions (.kts files)
      run: |
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
        sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
        sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts
        sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts

        sed -i 's/id("com.android.application") version "[^"]*" apply false/id("com.android.application") version "8.11.1" apply false/' android/settings.gradle.kts
        sed -i 's/id("com.android.library") version "[^"]*" apply false/id("com.android.library") version "8.11.1" apply false/' android/settings.gradle.kts

    - name: Fix AAPT2 Version and Add Gradle Properties
      run: |
        echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

    - name: Clean and Install dependencies
      run: |
        flutter clean
        flutter pub get

    - name: Build APKs (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Upload APK (arm64-v8a - Modern Phones)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    - name: Upload APK (armeabi-v7a - Old Phones)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Create Windows folder
      run: |
        if (Test-Path -Path "windows") { Remove-Item -Recurse -Force "windows" }
        flutter create --project-name cx_vpn --platforms=windows .

    - name: Enable Windows Desktop
      run: flutter config --enable-windows-desktop

    - name: Clean and Install dependencies
      run: |
        flutter clean
        flutter pub get

    - name: Build Windows App
      run: flutter build windows

    - name: Zip Windows App
      run: |
        Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\cx-vpn-windows.zip

    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-windows
        path: build/windows/cx-vpn-windows.zip
