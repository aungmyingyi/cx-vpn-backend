name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        # Version သတ်မှတ်မထားတော့ဘဲ Stable နောက်ဆုံးထွက်ကို အသုံးပြုစေမယ်
        cache: true

    - name: Create Android folder (v2)
      run: |
        rm -rf android
        flutter create --project-name cx_vpn --platforms=android .

    - name: Configure AndroidManifest (Permissions, VPN Service & Ads)
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        
        # 1. Permissions တွေ ထည့်မယ်
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" \/>\n\n    <application/' $MANIFEST

        # 2. VPN Service နဲ့ Start.io App ID ကို ထည့်မယ် (application အပိတ် </application> ရှေ့မှာ)
        sed -i 's|</application>|    <service android:name="com.flutter_v2ray_client.V2RayVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false" android:foregroundServiceType="specialUse">\n            <intent-filter>\n                <action android:name="android.net.VpnService"/>\n            </intent-filter>\n        </service>\n        <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="209308326" \/>\n        <meta-data android:name="com.startapp.sdk.RETURN_ADS_ENABLED" android:value="false" \/>\n    <\/application>|' $MANIFEST

    - name: Fix Android SDK and NDK Versions
      run: |
        # build.gradle ဖိုင်ထဲက SDK Version တွေကို ပြောင်းမယ်
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
        sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
        sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' android/app/build.gradle
        # NDK Version ကို သတ်မှတ်မယ်
        sed -i 's/ndkVersion flutter.ndkVersion/ndkVersion "27.0.12077973"/' android/app/build.gradle

    - name: Fix Android Gradle Plugin (AGP)
      run: |
        # SDK 36 ကို ထောက်ပံ့ဖို့ AGP ကို 8.5.0 ကို ပြောင်းမယ်
        sed -i 's/com.android.application" version ".*"/com.android.application" version "8.5.0"/' android/settings.gradle
        sed -i 's/com.android.library" version ".*"/com.android.library" version "8.5.0"/' android/settings.gradle

    - name: Fix AAPT2 Version for SDK 36
      run: |
        echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

    - name: Clean and Install dependencies
      run: |
        flutter clean
        flutter pub get

    - name: Build APKs (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Upload APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    - name: Upload APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

    - name: Upload APK (x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: cx-vpn-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
